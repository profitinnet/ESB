name: ibus

services:
  creatio:
    build: ../emulators
    image: ibus-emulator:pilot
    container_name: ibus-creatio
    environment:
      SERVICE: creatio
      BUS_URL: http://ibus-camel:8080/ingress/accounts
    ports:
      - "127.0.0.1:8891:8080"
    networks:
      - redpanda_default
    restart: unless-stopped

  sap-b1:
    image: ibus-emulator:pilot
    container_name: ibus-sap-b1
    environment:
      SERVICE: sap
    ports:
      - "127.0.0.1:8892:8080"
    networks:
      - redpanda_default
    restart: unless-stopped

  directum-rx:
    image: ibus-emulator:pilot
    container_name: ibus-directum-rx
    environment:
      SERVICE: directum
    ports:
      - "127.0.0.1:8893:8080"
    networks:
      - redpanda_default
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ibus-postgres
    environment:
      POSTGRES_USER: ibus
      POSTGRES_PASSWORD: ibus
      POSTGRES_DB: ibus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ibus-postgres:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibus -d ibus"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - redpanda_default
    restart: unless-stopped

  stand:
    build: ../stand
    image: ibus-stand:pilot
    container_name: ibus-stand
    environment:
      CREATIO_URL: http://ibus-creatio:8080
      SAP_URL: http://sap-b1:8080
      DIRECTUM_URL: http://directum-rx:8080
      CAMEL_URL: http://ibus-camel:8080
      BROKERS: redpanda:9092
    ports:
      - "8894:8080"
    networks:
      - redpanda_default
    depends_on:
      - creatio
      - sap-b1
      - directum-rx
    restart: unless-stopped

  ibus-camel:
    image: apache/camel-jbang:4.22.1
    container_name: ibus-camel
    command:
      - run
      - /integrations/delivery.camel.yaml
      - /integrations/ingress.camel.yaml
      - /integrations/sap-account.camel.yaml
      - /integrations/directum-account.camel.yaml
      - /integrations/control.camel.yaml
      - --dep=camel:kafka
      - --dep=camel:http
      - --dep=camel:jackson
      - --dep=camel:groovy
      - --dep=camel:sql
      - --dep=camel:platform-http
      - --dep=org.postgresql:postgresql:42.7.4
    volumes:
      - ../camel/routes:/integrations:ro
    ports:
      - "127.0.0.1:8890:8080"
    networks:
      - redpanda_default
    depends_on:
      postgres:
        condition: service_healthy
      sap-b1:
        condition: service_started
      directum-rx:
        condition: service_started
    restart: unless-stopped

  kaoto:
    image: quay.io/kaotoio/kaoto-app:main
    container_name: ibus-kaoto
    ports:
      - "8895:8080"
    volumes:
      - ./kaoto-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - redpanda_default
    restart: unless-stopped

networks:
  redpanda_default:
    external: true

volumes:
  ibus-postgres:
