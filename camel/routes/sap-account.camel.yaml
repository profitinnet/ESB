- route:
    id: sap-account
    autoStartup: false
    from:
      uri: kafka:crm.account.upserted.v1
      parameters:
        brokers: redpanda:9092
        groupId: ibus-sap
        autoOffsetReset: earliest
        autoCommitEnable: false
        allowManualCommit: true
        breakOnFirstError: true
        maxPollRecords: 1
        maxPollIntervalMs: 3600000
        sessionTimeoutMs: 10000
        heartbeatIntervalMs: 3000
      steps:
        - setProperty:
            name: system
            constant: sap
        - to: direct:capture-kafka
        - to: direct:sap-apply

- route:
    id: sap-account-replay
    autoStartup: false
    from:
      uri: kafka:replay.sap.account
      parameters:
        brokers: redpanda:9092
        groupId: ibus-sap-replay
        autoOffsetReset: earliest
        autoCommitEnable: false
        allowManualCommit: true
        breakOnFirstError: true
        maxPollRecords: 1
        maxPollIntervalMs: 3600000
        sessionTimeoutMs: 10000
        heartbeatIntervalMs: 3000
      steps:
        - setProperty:
            name: system
            constant: sap
        - to: direct:capture-kafka
        - to: direct:sap-apply

- route:
    id: sap-dlq
    errorHandler:
      noErrorHandler: {}
    from:
      uri: direct:sap-dlq
      steps:
        - setBody:
            simple: ${exchangeProperty.rawEvent}
        - removeHeaders:
            pattern: ".*"
        - setHeader:
            name: kafka.KEY
            simple: ${exchangeProperty.entityId}
        - convertBodyTo:
            type: byte[]
        - to:
            uri: kafka:dlq.sap.account
            parameters:
              brokers: redpanda:9092
              requestRequiredAcks: all
              enableIdempotence: true
              retries: 10
        - to: direct:kafka-commit

- route:
    id: sap-after-http
    errorHandler:
      noErrorHandler: {}
    from:
      uri: direct:sap-after-http
      steps:
        - setProperty:
            name: httpResult
            groovy: |
              def code = exchange.getMessage().getHeader('CamelHttpResponseCode')
              int status = 0
              if (code instanceof Number) {
                status = code.intValue()
              } else if (code != null && code.toString().trim()) {
                status = Integer.parseInt(code.toString())
              }
              exchange.setProperty('httpCode', status)
              if (status == 429 || status >= 500 || status == 0) {
                return 'transient'
              }
              if (status >= 400) {
                return 'data'
              }
              return 'ok'
        - choice:
            when:
              - simple: "${exchangeProperty.httpResult} == 'transient'"
                steps:
                  - setProperty:
                      name: retryHttp
                      groovy: |
                        int n = exchange.getProperty('tries') == null ? 0 : exchange.getProperty('tries') as int
                        long pause = Math.min(1000L << Math.min(n, 3), 5000L)
                        exchange.setProperty('tries', n + 1)
                        Thread.sleep(pause)
                        return 'yes'
              - simple: "${exchangeProperty.httpResult} == 'data'"
                steps:
                  - log:
                      message: "ошибка данных: system=sap entity=${exchangeProperty.entityId} http=${exchangeProperty.httpCode}"
                  - to: direct:sap-dlq
                  - setProperty:
                      name: finished
                      constant: "yes"
                  - setProperty:
                      name: retryHttp
                      constant: "no"
                  - setProperty:
                      name: tries
                      constant: "0"
            otherwise:
              steps:
                - setProperty:
                    name: finished
                    constant: "no"
                - setProperty:
                    name: retryHttp
                    constant: "no"
                - setProperty:
                    name: tries
                    constant: "0"

- route:
    id: sap-apply
    errorHandler:
      defaultErrorHandler:
        useOriginalMessage: true
        redeliveryPolicy:
          maximumRedeliveries: -1
          redeliveryDelay: 1000
          maximumRedeliveryDelay: 5000
          backOffMultiplier: 2
          useExponentialBackOff: true
          logRetryAttempted: true
          retryAttemptedLogLevel: WARN
    from:
      uri: direct:sap-apply
      steps:
        - setProperty:
            name: event
            groovy: |
              def raw = exchange.getProperty('rawEvent')
              if (raw == null) {
                raw = exchange.getMessage().getHeader('X-Raw-Event')
              }
              if (raw == null) {
                def current = exchange.getMessage().getBody()
                if (current instanceof byte[]) raw = new String(current, 'UTF-8')
                else raw = current == null ? '' : current.toString()
              }
              raw = raw.toString()
              exchange.setProperty('rawEvent', raw)
              def event = new com.fasterxml.jackson.databind.ObjectMapper().readValue(raw, Map.class)
              def data = event.get('data')
              def entityId = event.get('subject')
              if (entityId == null && data != null) entityId = data.get('Id')
              exchange.setProperty('entityId', entityId == null ? '' : entityId.toString())
              def modified = data == null ? null : data.get('ModifiedOn')
              exchange.setProperty('version', modified == null ? '' : modified.toString())
              def eventId = event.get('id')
              exchange.setProperty('eventId', eventId == null ? '' : eventId.toString())
              exchange.setProperty('poison', exchange.getProperty('version') == '' ? 'yes' : 'no')
              def code = data == null ? null : data.get('Code')
              def card = ''
              if (code != null && code.toString().trim()) {
                card = code.toString().trim()
                if (card.length() > 15) card = card.substring(0, 15)
              } else if (entityId != null) {
                def compact = entityId.toString().replace('-', '')
                card = compact.length() > 15 ? compact.substring(0, 15) : compact
              }
              exchange.setProperty('cardCode', card)
              return event
        - choice:
            when:
              - simple: "${exchangeProperty.poison} == 'yes'"
                steps:
                  - to: direct:sap-dlq
                  - stop: {}
        - to: direct:read-version
        - choice:
            when:
              - simple: "${exchangeProperty.applyDecision} == 'skip'"
                steps:
                  - log:
                      message: "пропуск: версия не новее system=${exchangeProperty.system} entity=${exchangeProperty.entityId} version=${exchangeProperty.version}"
                  - to: direct:kafka-commit
            otherwise:
              steps:
                - setProperty:
                    name: retryHttp
                    constant: "yes"
                - loop:
                    doWhile: true
                    expression:
                      simple: "${exchangeProperty.retryHttp} == 'yes'"
                    steps:
                      - setBody:
                          constant: '{"CompanyDB":"SBODEMO","UserName":"manager","Password":"manager"}'
                      - removeHeaders:
                          pattern: ".*"
                      - setHeader:
                          name: Content-Type
                          constant: application/json
                      - setHeader:
                          name: CamelHttpMethod
                          constant: POST
                      - to: "http://sap-b1:8080/b1s/v1/Login?bridgeEndpoint=true&throwExceptionOnFailure=false"
                      - to: direct:sap-after-http
                - choice:
                    when:
                      - simple: "${exchangeProperty.finished} == 'yes'"
                        steps:
                          - stop: {}
                - unmarshal:
                    json: {}
                - setProperty:
                    name: sessionId
                    simple: "${body[SessionId]}"
                - setProperty:
                    name: lookupReady
                    constant: "no"
                - loop:
                    doWhile: true
                    expression:
                      simple: "${exchangeProperty.lookupReady} == 'no'"
                    steps:
                      - removeHeaders:
                          pattern: ".*"
                      - setHeader:
                          name: Cookie
                          simple: "B1SESSION=${exchangeProperty.sessionId}"
                      - setHeader:
                          name: CamelHttpMethod
                          constant: GET
                      - toD: "http://sap-b1:8080/b1s/v1/BusinessPartners('${exchangeProperty.cardCode}')?bridgeEndpoint=true&throwExceptionOnFailure=false"
                      - setProperty:
                          name: sapLookup
                          groovy: |
                            def code = exchange.getMessage().getHeader('CamelHttpResponseCode')
                            int status = 0
                            if (code instanceof Number) {
                              status = code.intValue()
                            } else if (code != null && code.toString().trim()) {
                              status = Integer.parseInt(code.toString())
                            }
                            exchange.setProperty('httpCode', status)
                            if (status == 429 || status >= 500 || status == 0) {
                              int n = exchange.getProperty('tries') == null ? 0 : exchange.getProperty('tries') as int
                              long pause = Math.min(1000L << Math.min(n, 3), 5000L)
                              exchange.setProperty('tries', n + 1)
                              exchange.setProperty('lookupReady', 'no')
                              Thread.sleep(pause)
                              return 'transient'
                            }
                            exchange.setProperty('tries', 0)
                            exchange.setProperty('lookupReady', 'yes')
                            if (status == 200) return 'exists'
                            if (status == 404) return 'missing'
                            if (status >= 400) return 'data'
                            return 'missing'
                - choice:
                    when:
                      - simple: "${exchangeProperty.sapLookup} == 'data'"
                        steps:
                          - log:
                              message: "ошибка данных: system=sap entity=${exchangeProperty.entityId} http=${exchangeProperty.httpCode}"
                          - to: direct:sap-dlq
                          - stop: {}
                      - simple: "${exchangeProperty.sapLookup} == 'exists'"
                        steps:
                          - setProperty:
                              name: retryHttp
                              constant: "yes"
                          - loop:
                              doWhile: true
                              expression:
                                simple: "${exchangeProperty.retryHttp} == 'yes'"
                              steps:
                                - setBody:
                                    groovy: |
                                      def data = exchange.getProperty('event', Map).get('data')
                                      def code = exchange.getProperty('cardCode')
                                      def payload = new java.util.LinkedHashMap()
                                      payload.put('CardName', data.get('Name'))
                                      payload.put('CardType', 'cCustomer')
                                      payload.put('Phone1', data.get('Phone') ?: '')
                                      payload.put('Website', data.get('Web') ?: '')
                                      payload.put('FederalTaxID', data.get('TaxId') ?: '')
                                      def address = new java.util.LinkedHashMap()
                                      address.put('AddressName', 'Bill')
                                      address.put('Street', data.get('Address') ?: '')
                                      address.put('ZipCode', data.get('Zip') ?: '')
                                      address.put('AddressType', 'bo_BillTo')
                                      address.put('BPCode', code)
                                      payload.put('BPAddresses', [address])
                                      return payload
                                - marshal:
                                    json: {}
                                - removeHeaders:
                                    pattern: ".*"
                                - setHeader:
                                    name: Content-Type
                                    constant: application/json
                                - setHeader:
                                    name: Cookie
                                    simple: "B1SESSION=${exchangeProperty.sessionId}"
                                - setHeader:
                                    name: CamelHttpMethod
                                    constant: PATCH
                                - convertBodyTo:
                                    type: byte[]
                                - toD: "http://sap-b1:8080/b1s/v1/BusinessPartners('${exchangeProperty.cardCode}')?bridgeEndpoint=true&throwExceptionOnFailure=false"
                                - to: direct:sap-after-http
                          - choice:
                              when:
                                - simple: "${exchangeProperty.finished} == 'yes'"
                                  steps:
                                    - stop: {}
                    otherwise:
                      steps:
                        - setProperty:
                            name: retryHttp
                            constant: "yes"
                        - loop:
                            doWhile: true
                            expression:
                              simple: "${exchangeProperty.retryHttp} == 'yes'"
                            steps:
                              - setBody:
                                  groovy: |
                                    def data = exchange.getProperty('event', Map).get('data')
                                    def code = exchange.getProperty('cardCode')
                                    def payload = new java.util.LinkedHashMap()
                                    payload.put('CardCode', code)
                                    payload.put('CardName', data.get('Name'))
                                    payload.put('CardType', 'cCustomer')
                                    payload.put('Phone1', data.get('Phone') ?: '')
                                    payload.put('Website', data.get('Web') ?: '')
                                    payload.put('FederalTaxID', data.get('TaxId') ?: '')
                                    def address = new java.util.LinkedHashMap()
                                    address.put('AddressName', 'Bill')
                                    address.put('Street', data.get('Address') ?: '')
                                    address.put('ZipCode', data.get('Zip') ?: '')
                                    address.put('AddressType', 'bo_BillTo')
                                    address.put('BPCode', code)
                                    payload.put('BPAddresses', [address])
                                    return payload
                              - marshal:
                                  json: {}
                              - removeHeaders:
                                  pattern: ".*"
                              - setHeader:
                                  name: Content-Type
                                  constant: application/json
                              - setHeader:
                                  name: Cookie
                                  simple: "B1SESSION=${exchangeProperty.sessionId}"
                              - setHeader:
                                  name: CamelHttpMethod
                                  constant: POST
                              - convertBodyTo:
                                  type: byte[]
                              - to: "http://sap-b1:8080/b1s/v1/BusinessPartners?bridgeEndpoint=true&throwExceptionOnFailure=false"
                              - to: direct:sap-after-http
                        - choice:
                            when:
                              - simple: "${exchangeProperty.finished} == 'yes'"
                                steps:
                                  - stop: {}
                - to: direct:write-version
                - log:
                    message: "записано: system=${exchangeProperty.system} entity=${exchangeProperty.entityId} version=${exchangeProperty.version}"
                - to: direct:kafka-commit
