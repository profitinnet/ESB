- route:
    id: directum-account
    autoStartup: false
    errorHandler:
      deadLetterChannel:
        deadLetterUri: "kafka:dlq.directum.account?brokers=redpanda:9092"
        useOriginalMessage: true
        redeliveryPolicy:
          maximumRedeliveries: 0
    from:
      uri: kafka:crm.account.upserted.v1
      parameters:
        brokers: redpanda:9092
        groupId: ibus-directum
        autoOffsetReset: earliest
        autoCommitIntervalMs: 500
      steps:
        - unmarshal:
            json: {}
        - setProperty:
            name: event
            groovy: |
              return body
        - setProperty:
            name: creatioId
            groovy: |
              return body.get('subject')
        - removeHeaders:
            pattern: ".*"
        - setHeader:
            name: Username
            constant: ibus
        - setHeader:
            name: Password
            constant: ibus
        - setHeader:
            name: Accept
            constant: application/json
        - setHeader:
            name: CamelHttpMethod
            constant: GET
        - setHeader:
            name: CamelHttpQuery
            simple: "code=${exchangeProperty.creatioId}"
        - to: "http://directum-rx:8080/Integration/odata/ICompanies?bridgeEndpoint=true&throwExceptionOnFailure=false"
        - unmarshal:
            json: {}
        - setProperty:
            name: directumId
            groovy: |
              def rows = body instanceof Map ? body.get('value') : null
              if (rows == null || rows.isEmpty()) {
                return null
              }
              return rows.get(0).get('Id')
        - choice:
            when:
              - simple: "${exchangeProperty.directumId} != null"
                steps:
                  - setBody:
                      groovy: |
                        def data = exchange.getProperty('event', Map).get('data')
                        def address = data.get('Address') ?: ''
                        def zip = data.get('Zip') ?: ''
                        def legal = address
                        if (zip) {
                          legal = address ? address + ', ' + zip : zip
                        }
                        def payload = new java.util.LinkedHashMap()
                        payload.put('Name', data.get('Name'))
                        payload.put('TIN', data.get('TaxId') ?: '')
                        payload.put('Phone', data.get('Phone') ?: '')
                        payload.put('LegalAddress', legal)
                        if (data.get('PilotFail') == 'directum') {
                          payload.put('Reject', true)
                        }
                        return payload
                  - marshal:
                      json: {}
                  - removeHeaders:
                      pattern: ".*"
                  - setHeader:
                      name: Content-Type
                      constant: application/json
                  - setHeader:
                      name: Username
                      constant: ibus
                  - setHeader:
                      name: Password
                      constant: ibus
                  - setHeader:
                      name: X-Pilot-Reject
                      groovy: |
                        def data = exchange.getProperty('event', Map).get('data')
                        return data.get('PilotFail') == 'directum' ? 'directum' : ''
                  - setHeader:
                      name: CamelHttpMethod
                      constant: PATCH
                  - convertBodyTo:
                      type: byte[]
                  - toD: "http://directum-rx:8080/Integration/odata/ICompanies(${exchangeProperty.directumId})?bridgeEndpoint=true"
            otherwise:
              steps:
                - setBody:
                    groovy: |
                      def data = exchange.getProperty('event', Map).get('data')
                      def address = data.get('Address') ?: ''
                      def zip = data.get('Zip') ?: ''
                      def legal = address
                      if (zip) {
                        legal = address ? address + ', ' + zip : zip
                      }
                      def payload = new java.util.LinkedHashMap()
                      payload.put('Name', data.get('Name'))
                      payload.put('TIN', data.get('TaxId') ?: '')
                      payload.put('Phone', data.get('Phone') ?: '')
                      payload.put('LegalAddress', legal)
                      payload.put('Code', data.get('Id'))
                      if (data.get('PilotFail') == 'directum') {
                        payload.put('Reject', true)
                      }
                      return payload
                - marshal:
                    json: {}
                - removeHeaders:
                    pattern: ".*"
                - setHeader:
                    name: Content-Type
                    constant: application/json
                - setHeader:
                    name: Username
                    constant: ibus
                - setHeader:
                    name: Password
                    constant: ibus
                - setHeader:
                    name: X-Pilot-Reject
                    groovy: |
                      def data = exchange.getProperty('event', Map).get('data')
                      return data.get('PilotFail') == 'directum' ? 'directum' : ''
                - setHeader:
                    name: CamelHttpMethod
                    constant: POST
                - convertBodyTo:
                    type: byte[]
                - to: "http://directum-rx:8080/Integration/odata/ICompanies?bridgeEndpoint=true"
